services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - NLU_MODEL=baseline
      - LOG_LEVEL=INFO
      # Optionally set OPENAI_API_KEY here (or via `docker compose --env-file .env`)
      # to enable the real LLM provider; the app runs fine without it.
    # No volume mount for models/data: the image trains its own baseline
    # model during build (see Dockerfile), so it is self-contained. Bind-
    # mounting host ./models or ./data here would shadow that trained
    # model with the host's (gitignored, possibly empty/nonexistent)
    # directory, breaking inference at runtime.

  dashboard:
    build:
      context: .
      dockerfile: docker/Dockerfile.streamlit
    ports:
      - "8501:8501"
    environment:
      - API_BASE_URL=http://api:8000
    depends_on:
      - api
