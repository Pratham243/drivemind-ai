name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff black pytest

      - name: Lint (ruff)
        run: ruff check src/ tests/ scripts/

      - name: Format check (black)
        run: black --check src/ tests/ scripts/

      - name: Generate dataset
        run: python scripts/generate_dataset.py

      - name: Validate dataset
        run: python scripts/validate_dataset.py

      - name: Train baseline model
        run: python scripts/train_baseline.py

      - name: Run tests
        run: pytest tests/ -v

  build-docker:
    runs-on: ubuntu-latest
    needs: lint-and-test
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      # The Docker image COPYs data/ and models/, but generated dataset and
      # trained model artifacts are gitignored (reproducible, not checked
      # in) — so this job regenerates them before building the image.
      - name: Generate dataset and train baseline model
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python scripts/generate_dataset.py
          python scripts/train_baseline.py

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build API image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: false
          tags: drivemind-ai-api:ci
